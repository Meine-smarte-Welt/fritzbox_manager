# SHA256 (Inhalt ab Zeile 2, d.h. dieser Datei ohne diese erste Zeile): a4f2d19a8846ba261a5a8bf557bea7a0a64fa7c810790192193a3c9927fd8d9e
type: custom:fritzbox-manager-card
title: Meine FRITZ!Box
show_title: true
# Kategorien einzeln ein-/ausschalten (mindestens eine bleibt sichtbar)
show_overview: true
show_system: true
show_internet: true
show_wifi: true
show_modules: true
show_settings: true
default_tab: overview
# Karteikarten der Übersicht einzeln ein-/ausschalten (Standard: alle an)
show_tile_internet: true
show_tile_download: true
show_tile_upload: true
show_tile_wifi: true
show_tile_box: true
show_tile_traffic: true
show_tile_dsl: false      # z. B. bei Glasfaser: keine DSL-Werte (auch nicht in "Internet")
show_tile_quick: true
zoom: 1
read_only: false
# Optional: Entitäten der Schwester-Integrationen von Hand festlegen,
# falls die automatische Erkennung nichts findet
module_calls_config:
  entity_eingehend: sensor.fritzbox_anrufe_eingehend
  entity_ausgehend: sensor.fritzbox_anrufe_ausgehend
  entity_verpasst: sensor.fritzbox_anrufe_verpasst
module_network_config:
  entity: sensor.fritzbox_netzwerk_geraete
module_events_config:
  entity: sensor.fritzbox_ereignisse
# Farben (leer = Theme-Standard)
color_tab_active: "#03a9f4"
